# --- Batch 2: the first-person dungeon view. Textures are stretched over
# the original wall, door and floor geometry and shaded by depth; sprites
# are fitted to the box the original outline covers. Any size is allowed.
# No [dungeon.secret]: secret doors look exactly like walls, as they do in
# the original. Traps are invisible in the original and have no art.

[dungeon.wall]
file = "dungeon/wall.png"

[dungeon.door]
file = "dungeon/door.png"

[dungeon.floor]
file = "dungeon/floor.png"

[dungeon.ceiling]
