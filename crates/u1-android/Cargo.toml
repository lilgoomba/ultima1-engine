[package]
name = "u1-android"
description = "The u1 engine as an Android library (libmain.so, started by SDL2's Java activity)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "main"
crate-type = ["cdylib"]
# The desktop program's tests already run in crates/u1.
test = false

[dependencies]
u1-assets = { path = "../u1-assets" }
sdl2 = "0.37"
png = "0.17"
libc = "0.2"
jni-sys = "0.3"

[lints]
workspace = true
