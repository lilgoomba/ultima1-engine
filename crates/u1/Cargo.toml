[package]
name = "u1"
description = "Playable Ultima I overworld for the u1 engine (needs your own game files)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
u1-assets = { path = "../u1-assets" }
sdl2 = "0.37"
png = "0.17"
libc = "0.2"

[features]
# Build SDL2 from source (needs cmake and a C compiler) and link it in, for
# platforms without a system SDL2 (the Windows CI job).
bundled = ["sdl2/bundled", "sdl2/static-link"]
# No console window on Windows (the portable ZIP); no effect elsewhere.
windows-gui = []

[lints]
workspace = true
